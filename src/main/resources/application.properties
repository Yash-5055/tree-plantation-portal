# ===== Default: H2 in-memory DB so the app runs instantly with no setup =====
spring.datasource.url=jdbc:h2:mem:tppdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Switch to PostgreSQL for real deployment: comment out H2 block above,
#       uncomment below, and set your DB credentials =====
# spring.datasource.url=jdbc:postgresql://localhost:5432/tpp_db
# spring.datasource.username=postgres
# spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8080

management.endpoints.web.exposure.include=health,info
