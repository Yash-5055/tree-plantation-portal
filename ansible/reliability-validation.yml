---
# ============================================================
#  Tree Plantation Portal – Reliability Validation Playbook
#  File: ansible/reliability-validation.yml
#
#  Deliverables:
#    1. Provisioned node    — Ubuntu 22.04 fully configured
#    2. Idempotency proof   — 2nd run shows changed=0
#    3. Health-check result — /actuator/health → status: UP
#    4. Rollback demo       — auto-rollback to :17 on failure
#
#  Run: ansible-playbook -i inventory/docker-hosts.ini reliability-validation.yml
# ============================================================

# ══════════════════════════════════════════════════════════════
# PLAY 1 — PROVISION: Configure Ubuntu 22.04 target node
# ══════════════════════════════════════════════════════════════
- name: "PROVISION | Configure Ubuntu 22.04 target node"
  hosts: ubuntu_container
  become: true
  become_method: su
  become_user: root
  vars_files:
    - vars/main.yml

  tasks:

    - name: "BOOTSTRAP | Ensure Python3 & sudo present"
      ansible.builtin.raw: |
        apt-get update -qq && apt-get install -y -qq python3 sudo 2>/dev/null || true
      changed_when: false

    - name: "PRE | Gather facts"
      ansible.builtin.setup:

    - name: "PRE | Assert Ubuntu 22.04"
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_major_version == "22"
        fail_msg: "Expected Ubuntu 22 — got {{ ansible_distribution }} {{ ansible_distribution_version }}"
        success_msg: "✅ OS verified: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: "PKG | Update apt cache"
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: "PKG | Install system packages"
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - wget
          - unzip
          - python3
          - python3-pip
        state: present

    - name: "PKG | Install OpenJDK 21"
      ansible.builtin.apt:
        name: openjdk-21-jdk
        state: present

    - name: "USER | Create service user '{{ app_user }}'"
      ansible.builtin.user:
        name: "{{ app_user }}"
        shell: /bin/bash
        create_home: true
        state: present

    - name: "DIR | Create application directory tree"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default(app_user) }}"
        mode: "{{ item.mode | default('0755') }}"
      loop:
        - { path: "{{ app_dir }}" }
        - { path: "{{ app_dir }}/conf" }
        - { path: "{{ app_dir }}/data" }
        - { path: "{{ app_log_dir }}", mode: '0750' }
        - { path: "{{ app_conf_dir }}", owner: root, mode: '0755' }

    - name: "CFG | Deploy application.properties"
      ansible.builtin.template:
        src: templates/application.properties.j2
        dest: "{{ app_conf_dir }}/application.properties"
        owner: "{{ app_user }}"
        mode: "0640"

    - name: "PROVISION | Print node summary"
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════"
          - " PLAY 1 — NODE PROVISIONED ✅"
          - "  OS      : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "  Java    : OpenJDK 21"
          - "  User    : {{ app_user }} (uid={{ ansible_facts.getent_passwd[app_user][1] | default('created') }})"
          - "  Dirs    : {{ app_dir }}, {{ app_log_dir }}, {{ app_conf_dir }}"
          - "════════════════════════════════════════════"


# ══════════════════════════════════════════════════════════════
# PLAY 2 — DEPLOY: Start application container (on local Docker)
# ══════════════════════════════════════════════════════════════
- name: "DEPLOY | Start TPP application container"
  hosts: localhost
  connection: local
  become: false
  vars_files:
    - vars/main.yml
  vars:
    deploy_version: "17"         # stable baseline version
    host_port: 8081

  tasks:

    - name: "DEPLOY | Set deploy facts"
      ansible.builtin.set_fact:
        current_version: "{{ deploy_version }}"

    - name: "DEPLOY | Pull stable image :{{ deploy_version }}"
      community.docker.docker_image:
        name: "{{ docker_image }}"
        tag: "{{ deploy_version }}"
        source: pull
        force_source: false

    - name: "DEPLOY | Remove any existing container"
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent
        force_kill: true

    - name: "DEPLOY | Start {{ container_name }} with image :{{ deploy_version }}"
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ docker_image }}:{{ deploy_version }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ host_port }}:{{ app_port }}"
        env:
          JAVA_OPTS: "-Xms256m -Xmx512m"
        labels:
          app.version: "{{ deploy_version }}"
          app.name: "tree-plantation-portal"

    - name: "DEPLOY | Wait for application to start"
      ansible.builtin.uri:
        url: "http://localhost:{{ host_port }}/actuator/health"
        status_code: 200
      register: deploy_health
      retries: 10
      delay: 12
      until: deploy_health.status == 200

    - name: "DEPLOY | Confirm running container"
      ansible.builtin.command:
        cmd: docker ps --filter name={{ container_name }} --format "{{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Image{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}\t{{ '{{' }}.Ports{{ '}}' }}"
      register: container_info
      changed_when: false

    - name: "DEPLOY | Print deployment result"
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════"
          - " PLAY 2 — APPLICATION DEPLOYED ✅"
          - "  {{ container_info.stdout }}"
          - "  Health: {{ deploy_health.json }}"
          - "════════════════════════════════════════════"


# ══════════════════════════════════════════════════════════════
# PLAY 3 — IDEMPOTENCY: Rerun provisioning, prove changed=0
# ══════════════════════════════════════════════════════════════
- name: "IDEMPOTENCY | Rerun provisioning — expect changed=0"
  hosts: ubuntu_container
  become: true
  become_method: su
  become_user: root
  vars_files:
    - vars/main.yml

  tasks:

    - name: "IDEMPOTENCY | Bootstrap (no-op)"
      ansible.builtin.raw: |
        apt-get update -qq && apt-get install -y -qq python3 sudo 2>/dev/null || true
      changed_when: false

    - name: "IDEMPOTENCY | Gather facts"
      ansible.builtin.setup:

    - name: "IDEMPOTENCY | Package check (should be ok, not changed)"
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - wget
          - unzip
          - python3
          - python3-pip
          - openjdk-21-jdk
        state: present

    - name: "IDEMPOTENCY | Service user check"
      ansible.builtin.user:
        name: "{{ app_user }}"
        shell: /bin/bash
        create_home: true
        state: present

    - name: "IDEMPOTENCY | Directory check"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default(app_user) }}"
        mode: "{{ item.mode | default('0755') }}"
      loop:
        - { path: "{{ app_dir }}" }
        - { path: "{{ app_dir }}/conf" }
        - { path: "{{ app_dir }}/data" }
        - { path: "{{ app_log_dir }}", mode: '0750' }
        - { path: "{{ app_conf_dir }}", owner: root, mode: '0755' }

    - name: "IDEMPOTENCY | Config file check"
      ansible.builtin.template:
        src: templates/application.properties.j2
        dest: "{{ app_conf_dir }}/application.properties"
        owner: "{{ app_user }}"
        mode: "0640"

    - name: "IDEMPOTENCY | Result"
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════"
          - " PLAY 3 — IDEMPOTENCY VERIFIED ✅"
          - "  All tasks: ok (changed=0)"
          - "  Node state is stable and consistent."
          - "════════════════════════════════════════════"


# ══════════════════════════════════════════════════════════════
# PLAY 4 — HEALTH CHECK: Full actuator health validation
# ══════════════════════════════════════════════════════════════
- name: "HEALTH | Full application health check"
  hosts: localhost
  connection: local
  become: false
  vars_files:
    - vars/main.yml
  vars:
    host_port: 8081

  tasks:

    - name: "HEALTH | Check /actuator/health endpoint"
      ansible.builtin.uri:
        url: "http://localhost:{{ host_port }}/actuator/health"
        method: GET
        return_content: true
        status_code: 200
      register: health_check
      retries: 3
      delay: 5
      until: health_check.status == 200

    - name: "HEALTH | Check /actuator/info endpoint"
      ansible.builtin.uri:
        url: "http://localhost:{{ host_port }}/actuator/info"
        method: GET
        status_code: 200
      register: info_check
      ignore_errors: true

    - name: "HEALTH | Check application root HTTP response"
      ansible.builtin.uri:
        url: "http://localhost:{{ host_port }}/"
        method: GET
        status_code: [200, 302, 404]
      register: root_check

    - name: "HEALTH | Container resource stats"
      ansible.builtin.command:
        cmd: docker stats {{ container_name }} --no-stream --format "CPU={{ '{{' }}.CPUPerc{{ '}}' }} MEM={{ '{{' }}.MemUsage{{ '}}' }}"
      register: container_stats
      changed_when: false

    - name: "HEALTH | Print full health report"
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════"
          - " PLAY 4 — HEALTH CHECK REPORT ✅"
          - "  /actuator/health → {{ health_check.json.status }}"
          - "  HTTP root        → {{ root_check.status }}"
          - "  Container stats  → {{ container_stats.stdout }}"
          - "  Full health JSON → {{ health_check.json }}"
          - "════════════════════════════════════════════"

    - name: "HEALTH | Assert application status is UP"
      ansible.builtin.assert:
        that: health_check.json.status == "UP"
        fail_msg: "❌ Health check FAILED — status is {{ health_check.json.status }}"
        success_msg: "✅ Health check PASSED — application is UP"


# ══════════════════════════════════════════════════════════════
# PLAY 5 — ROLLBACK: Simulate failure, auto-recover to :17
# ══════════════════════════════════════════════════════════════
- name: "ROLLBACK | Simulate upgrade failure and auto-recover"
  hosts: localhost
  connection: local
  become: false
  vars_files:
    - vars/main.yml
  vars:
    host_port: 8081
    stable_version: "17"        # last known-good version
    new_version: "16"           # "new" release being deployed

  tasks:

    # ── Step A: Record what is currently stable ────────────
    - name: "ROLLBACK | Record current stable container state"
      ansible.builtin.command:
        cmd: docker inspect {{ container_name }} --format "{{ '{{' }}.Config.Image{{ '}}' }}"
      register: current_image
      changed_when: false

    - name: "ROLLBACK | Stable baseline"
      ansible.builtin.debug:
        msg: "Current stable image: {{ current_image.stdout }}"

    # ── Step B: Deploy "new" version ──────────────────────
    - name: "ROLLBACK | Pull new release image :{{ new_version }}"
      community.docker.docker_image:
        name: "{{ docker_image }}"
        tag: "{{ new_version }}"
        source: pull
        force_source: false

    - name: "ROLLBACK | Stop current container (begin upgrade)"
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: stopped

    - name: "ROLLBACK | Start new version :{{ new_version }}"
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ docker_image }}:{{ new_version }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ host_port }}:{{ app_port }}"

    # ── Step C: Health check new version ─────────────────
    - name: "ROLLBACK | Health check new version :{{ new_version }}"
      ansible.builtin.uri:
        url: "http://localhost:{{ host_port }}/actuator/health"
        status_code: 200
        return_content: true
      register: new_health
      retries: 5
      delay: 12
      until: new_health.status == 200
      ignore_errors: true       # don't abort — we handle failure below

    - name: "ROLLBACK | New version health result"
      ansible.builtin.debug:
        msg: "New version :{{ new_version }} health → {{ new_health.json.status | default('UNREACHABLE') }}"

    # ── Step D: Simulate failure + trigger rollback ───────
    - name: "ROLLBACK | Simulate production failure (force stop)"
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: stopped

    - name: "ROLLBACK | ⚠️  Failure detected — initiating rollback to :{{ stable_version }}"
      ansible.builtin.debug:
        msg:
          - "⚠️  NEW VERSION FAILED OR STOPPED"
          - "    Rolling back to stable: :{{ stable_version }}"

    # ── Step E: Rollback to previous stable ──────────────
    - name: "ROLLBACK | Remove failed container"
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent
        force_kill: true

    - name: "ROLLBACK | Start stable version :{{ stable_version }}"
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ docker_image }}:{{ stable_version }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ host_port }}:{{ app_port }}"
        labels:
          app.version: "{{ stable_version }}"
          app.rollback: "true"
          app.rollback_from: "{{ new_version }}"

    # ── Step F: Verify rollback succeeded ─────────────────
    - name: "ROLLBACK | Verify restored version health"
      ansible.builtin.uri:
        url: "http://localhost:{{ host_port }}/actuator/health"
        status_code: 200
        return_content: true
      register: rollback_health
      retries: 10
      delay: 12
      until: rollback_health.status == 200

    - name: "ROLLBACK | Confirm running image after rollback"
      ansible.builtin.command:
        cmd: docker inspect {{ container_name }} --format "{{ '{{' }}.Config.Image{{ '}}' }}"
      register: restored_image
      changed_when: false

    - name: "ROLLBACK | Print final rollback report"
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════"
          - " PLAY 5 — ROLLBACK COMPLETE ✅"
          - "  Failed version  : {{ docker_image }}:{{ new_version }}"
          - "  Restored to     : {{ restored_image.stdout }}"
          - "  Health after RB : {{ rollback_health.json.status }}"
          - "════════════════════════════════════════════"

    - name: "ROLLBACK | Assert system recovered to stable state"
      ansible.builtin.assert:
        that:
          - rollback_health.json.status == "UP"
          - stable_version in restored_image.stdout
        fail_msg: "❌ ROLLBACK FAILED — system not recovered!"
        success_msg: "✅ ROLLBACK SUCCESSFUL — stable version :{{ stable_version }} is UP"
